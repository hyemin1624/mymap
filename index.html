<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전국 애니메이션 굿즈샵 안내 지도</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 카카오맵 JavaScript SDK 로드 -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=7dc4b6e17f706b35e52af0bb2e9c56e5&libraries=services&autoload=false"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">

    <!-- 상단 헤더 -->
    <header class="bg-white shadow px-6 py-4 flex items-center justify-between z-10">
        <h1 class="text-xl font-bold text-gray-800">✨ 전국 애니메이션 굿즈샵 성지 지도</h1>
        <span id="status-message" class="text-sm text-gray-500">현재 위치 확인 및 굿즈샵 로드 중...</span>
    </header>

    <!-- 메인 컨테이너 (2분할 레이아웃) -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- 왼쪽: 지역별 탭 버튼 및 리스트 영역 -->
        <section class="w-full md:w-96 bg-white border-r border-gray-200 flex flex-col z-10">
            
            <!-- 지역별 및 전체 탭 버튼 영역 -->
            <div class="grid grid-cols-4 gap-1 p-3 border-b border-gray-200 bg-gray-50">
                <button 
                    id="tab-all" 
                    onclick="switchRegion('all')"
                    class="py-2 px-1 rounded-lg text-xs font-bold bg-blue-600 text-white transition shadow-sm"
                >
                    🌐 전체
                </button>
                <button 
                    id="tab-seoul" 
                    onclick="switchRegion('seoul')"
                    class="py-2 px-1 rounded-lg text-xs font-bold bg-gray-200 text-gray-700 hover:bg-gray-300 transition"
                >
                    🗼 서울
                </button>
                <button 
                    id="tab-daejeon" 
                    onclick="switchRegion('daejeon')"
                    class="py-2 px-1 rounded-lg text-xs font-bold bg-gray-200 text-gray-700 hover:bg-gray-300 transition"
                >
                    🏛️ 대전
                </button>
                <button 
                    id="tab-busan" 
                    onclick="switchRegion('busan')"
                    class="py-2 px-1 rounded-lg text-xs font-bold bg-gray-200 text-gray-700 hover:bg-gray-300 transition"
                >
                    🌊 부산
                </button>
            </div>

            <!-- 검색 결과 리스트 -->
            <div id="place-list" class="flex-1 overflow-y-auto divide-y divide-gray-100">
                <div class="p-6 text-center text-gray-400 text-sm">
                    매장 정보를 불러오는 중입니다...
                </div>
            </div>
        </section>

        <!-- 오른쪽: 지도 영역 -->
        <section class="flex-1 relative">
            <div id="map" class="w-full h-full"></div>

            <!-- 로드뷰 보기 버튼 -->
            <button 
                onclick="openRoadview()" 
                class="absolute top-4 right-4 bg-white hover:bg-gray-100 text-gray-800 font-semibold px-4 py-2 rounded-lg shadow-md border border-gray-300 text-sm z-10 transition"
            >
                👀 지도 중심 로드뷰 보기
            </button>
        </section>
    </main>

    <!-- JavaScript 로직 -->
    <script>
        // 지역별 굿즈샵 데이터 정의
        const seoulShops = [
            "애니메이트 홍대점", "라신반 서울본점", "피규어프레소 홍대점", "안서당", 
            "제이에스스토어", "CIH+SHOP", "오모차랜드 홍대점", "최애굿즈 홍대점", 
            "모와즐", "브라더굿즈", "아이노모노", "팝몬 홍대점", "케이북스 홍대",
            "국제전자센터 하비파크", "국제전자센터 논노21", "국제전자센터 덴덴샵", 
            "국제전자센터 쿄우마샵", "건담베이스 용산아이파크몰점", "코믹존", 
            "애니플러스샵 홍대점", "토이저러스 홍대점", "피규어프레소 신도림점"
        ];

        const daejeonShops = [
            "제이굿즈 대전점", "애니세카이", "애니플러스샵 대전 중앙로점", 
            "건담베이스 대전점", "토이앤하비 대전", "대전 피규어박스", 
            "은행동 가챠샵", "대전 토이프렌드", "대전 굿즈랜드"
        ];

        const busanShops = [
            "애니메이트 부산점", "애니플러스샵 부산서면점", "제이굿즈 부산점", 
            "건담베이스 부산점", "서면 애니메클럽", "부산 애니창고", 
            "남포동 피규어샵", "서면 삼정타워", "부산대 토이프렌드"
        ];

        let map = null;
        let ps = null;
        let infowindow = null;
        let markers = [];
        let currentPosMarker = null; // 현재 위치 마커

        kakao.maps.load(function() {
            initMap();
        });

        function initMap() {
            const container = document.getElementById('map');
            const options = {
                center: new kakao.maps.LatLng(37.5563, 126.9231), // 기본 홍대 중심
                level: 5
            };

            map = new kakao.maps.Map(container, options);
            ps = new kakao.maps.services.Places();
            infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

            // 사용자 현재 위치 확인 및 표시
            initCurrentLocation();

            // 초기 실행 시 '전체' 탭 기준 로드
            switchRegion('all');
        }

        // 현재 위치 확인 및 지도 표시 함수
        function initCurrentLocation() {
            const statusMessage = document.getElementById('status-message');
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const locPosition = new kakao.maps.LatLng(lat, lng);

                        // 현재 위치 마커 이미지 (기본 마커 또는 특수 마커 커스텀 가능)
                        currentPosMarker = new kakao.maps.Marker({
                            position: locPosition,
                            map: map
                        });

                        statusMessage.textContent = "현재 위치를 성공적으로 표시했습니다.";
                    },
                    function(error) {
                        statusMessage.textContent = "위치 권한 거부됨 (기본 위치 기준 실행)";
                    }
                );
            } else {
                statusMessage.textContent = "위치 정보를 지원하지 않는 브라우저입니다.";
            }
        }

        // 탭 전환 함수 (전체, 서울, 대전, 부산)
        function switchRegion(regionKey) {
            // 모든 탭 버튼 스타일 초기화
            document.getElementById('tab-all').className = "py-2 px-1 rounded-lg text-xs font-bold bg-gray-200 text-gray-700 hover:bg-gray-300 transition";
            document.getElementById('tab-seoul').className = "py-2 px-1 rounded-lg text-xs font-bold bg-gray-200 text-gray-700 hover:bg-gray-300 transition";
            document.getElementById('tab-daejeon').className = "py-2 px-1 rounded-lg text-xs font-bold bg-gray-200 text-gray-700 hover:bg-gray-300 transition";
            document.getElementById('tab-busan').className = "py-2 px-1 rounded-lg text-xs font-bold bg-gray-200 text-gray-700 hover:bg-gray-300 transition";

            let targetLists = [];
            let activeBtnId = '';

            if (regionKey === 'all') {
                targetLists = [
                    { regionName: "🗼 서울 지역", names: seoulShops, colorType: "seoul" },
                    { regionName: "🏛️ 대전 지역", names: daejeonShops, colorType: "daejeon" },
                    { regionName: "🌊 부산 지역", names: busanShops, colorType: "busan" }
                ];
                activeBtnId = 'tab-all';
            } else if (regionKey === 'seoul') {
                targetLists = [{ regionName: "🗼 서울 지역", names: seoulShops, colorType: "seoul" }];
                activeBtnId = 'tab-seoul';
            } else if (regionKey === 'daejeon') {
                targetLists = [{ regionName: "🏛️ 대전 지역", names: daejeonShops, colorType: "daejeon" }];
                activeBtnId = 'tab-daejeon';
            } else if (regionKey === 'busan') {
                targetLists = [{ regionName: "🌊 부산 지역", names: busanShops, colorType: "busan" }];
                activeBtnId = 'tab-busan';
            }

            document.getElementById(activeBtnId).className = "py-2 px-1 rounded-lg text-xs font-bold bg-blue-600 text-white transition shadow-sm";

            loadGroupedPlaces(targetLists);
        }

        // 여러 지역/그룹의 매장 데이터를 동시에 불러오는 함수
        function loadGroupedPlaces(groupList) {
            const listEl = document.getElementById('place-list');
            listEl.innerHTML = '<div class="p-6 text-center text-gray-400 text-sm">데이터를 불러오는 중입니다...</div>';
            removeMarkers();

            let totalGroups = groupList.length;
            let completedGroups = 0;
            const allRenderData = [];

            groupList.forEach(group => {
                let groupCount = 0;
                let groupPlaces = [];

                group.names.forEach(name => {
                    ps.keywordSearch(name, function(data, status) {
                        groupCount++;
                        if (status === kakao.maps.services.Status.OK && data.length > 0) {
                            // 검색 결과 첫 번째 객체에 지역명과 마커 색상 타입 지정
                            const placeObj = data[0];
                            placeObj.customRegion = group.regionName;
                            placeObj.colorType = group.colorType;
                            groupPlaces.push(placeObj);
                        }

                        if (groupCount === group.names.length) {
                            allRenderData.push({
                                regionName: group.regionName,
                                places: groupPlaces
                            });
                            completedGroups++;

                            if (completedGroups === totalGroups) {
                                renderGroupedPlaces(allRenderData);
                            }
                        }
                    });
                });
            });
        }

        // 지역별 색상 마커 생성 함수 (서울: 파랑, 대전: 초록, 부산: 주황)
        function createColorMarker(position, colorType) {
            let markerImageUrl = 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_blue.png'; // 기본 서울 파랑
            
            if (colorType === 'daejeon') {
                markerImageUrl = 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_green.png'; // 대전 초록
            } else if (colorType === 'busan') {
                markerImageUrl = 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png'; // 부산 주황/빨강 계열
            }

            const imageSize = new kakao.maps.Size(24, 35);
            const markerImage = new kakao.maps.MarkerImage(markerImageUrl, imageSize);

            const marker = new kakao.maps.Marker({
                position: position,
                image: markerImage,
                map: map
            });

            return marker;
        }

        // 받아온 데이터를 화면 리스트와 마커에 렌더링
        function renderGroupedPlaces(groupedData) {
            const listEl = document.getElementById('place-list');
            listEl.innerHTML = '';
            removeMarkers();

            const bounds = new kakao.maps.LatLngBounds();
            let hasData = false;

            groupedData.forEach(group => {
                if (group.places.length === 0) return;
                hasData = true;

                // 지역 섹션 헤더 생성
                const headerEl = document.createElement('div');
                headerEl.className = 'bg-gray-100 px-4 py-2 text-xs font-bold text-gray-600 border-b border-gray-200';
                headerEl.textContent = group.regionName;
                listEl.appendChild(headerEl);

                group.places.forEach(place => {
                    const position = new kakao.maps.LatLng(place.y, place.x);

                    // 지역별 색상 마커 생성 (숫자 없음)
                    const marker = createColorMarker(position, place.colorType);
                    markers.push(marker);
                    bounds.extend(position);

                    // 리스트 아이템 생성
                    const itemEl = document.createElement('div');
                    itemEl.className = 'p-4 hover:bg-gray-50 cursor-pointer transition border-b border-gray-100';
                    itemEl.innerHTML = `
                        <h5 class="font-bold text-gray-800 text-sm">${place.place_name}</h5>
                        <p class="text-xs text-gray-600 mt-1">도로명: ${place.road_address_name || place.address_name}</p>
                        ${place.phone ? `<p class="text-xs text-blue-600 mt-1">📞 ${place.phone}</p>` : ''}
                    `;

                    // 클릭 이벤트 연동
                    kakao.maps.event.addListener(marker, 'click', function() {
                        displayInfowindow(marker, place);
                    });

                    itemEl.addEventListener('click', function() {
                        map.setCenter(marker.getPosition());
                        displayInfowindow(marker, place);
                    });

                    listEl.appendChild(itemEl);
                });
            });

            if (!hasData) {
                listEl.innerHTML = '<div class="p-6 text-center text-gray-400 text-sm">표시할 매장 정보가 없습니다.</div>';
                return;
            }

            map.setBounds(bounds);
            document.getElementById('status-message').textContent = "마커 및 리스트 렌더링 완료";
        }

        function removeMarkers() {
            for (let i = 0; i < markers.length; i++) {
                markers[i].setMap(null);
            }
            markers = [];
        }

        function displayInfowindow(marker, place) {
            const content = `
                <div style="padding:10px;font-size:12px;width:200px;z-index:1;">
                    <strong style="font-size:14px;color:#1d4ed8;">${place.place_name}</strong><br>
                    <span style="color:#4b5563;display:block;margin-top:4px;">${place.road_address_name || place.address_name}</span>
                    ${place.phone ? `<span style="color:#2563eb;display:block;margin-top:2px;">📞 ${place.phone}</span>` : ''}
                    <a href="${place.place_url}" target="_blank" style="color:#059669;display:block;margin-top:4px;text-decoration:underline;">카카오맵 상세보기</a>
                </div>
            `;
            infowindow.setContent(content);
            infowindow.open(map, marker);
        }

        function openRoadview() {
            const center = map.getCenter();
            const rvUrl = `https://map.kakao.com/?roadview=true&y=${center.getLat()}&x=${center.getLng()}`;
            window.open(rvUrl, '_blank');
        }
    </script>
</body>
</html>
