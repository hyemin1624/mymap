<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전국 애니메이션 굿즈샵 & 피규어 성지 지도</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 카카오맵 SDK -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=7dc4b6e17f706b35e52af0bb2e9c56e5&libraries=services&autoload=false"></script>
    <style>
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col overflow-hidden m-0 font-sans">

    <!-- 상단 헤더 -->
    <header class="bg-slate-900 text-white px-6 py-3.5 flex items-center justify-between shadow z-10">
        <h1 class="text-sm font-bold flex items-center gap-2">
            <span>✨</span> 애니메이션 굿즈 & 피규어 성지 지도
        </h1>
        <span id="status" class="text-xs text-slate-400">홍대 굿즈샵 탐색 완료</span>
    </header>

    <!-- 메인 레이아웃 -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- 왼쪽 사이드바 -->
        <section class="w-full md:w-96 bg-white border-r border-slate-200 flex flex-col shadow-sm z-10">
            
            <!-- 2개로 줄인 카테고리 탭 (피규어샵 / 굿즈샵) -->
            <div class="grid grid-cols-2 gap-1 p-3 bg-slate-50 border-b border-slate-200">
                <button onclick="changeCategory('figure', this)" class="tab-btn py-2 text-xs font-bold bg-indigo-600 text-white rounded-lg shadow-sm transition">🏛️ 피규어샵</button>
                <button onclick="changeCategory('goods', this)" class="tab-btn py-2 text-xs font-bold bg-white text-slate-700 border border-slate-200 rounded-lg transition">🛍️ 굿즈샵</button>
            </div>

            <!-- 지역 검색창 -->
            <div class="p-3 border-b border-slate-200 bg-white">
                <form id="form" class="flex gap-2">
                    <input type="text" id="keyword" placeholder="지역 검색 (예: 홍대, 대전, 부산)" class="flex-1 px-3 py-2 bg-slate-100 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-xs font-bold transition">검색</button>
                </form>
            </div>

            <!-- 매장 리스트 -->
            <div id="list" class="flex-1 overflow-y-auto divide-y divide-slate-100">
                <div class="p-8 text-center text-slate-400 text-xs">매장 정보를 불러오는 중입니다...</div>
            </div>
        </section>

        <!-- 오른쪽 지도 -->
        <section class="flex-1 relative">
            <div id="map" class="w-full h-full"></div>

            <!-- 현재 위치로 이동 버튼 -->
            <button onclick="moveToCurrentLocation()" class="absolute top-4 right-4 bg-white hover:bg-slate-50 text-slate-700 font-bold px-3.5 py-2 rounded-xl shadow-lg border border-slate-200 text-xs transition z-10 flex items-center gap-1.5">
                <span>📍</span> 내 위치로
            </button>
        </section>
    </main>

    <!-- 스크립트 로직 -->
    <script>
        let map, ps, infowindow;
        let markers = [];
        let currentPosition = null;
        let currentCategory = 'figure'; // 기본 탭: 피규어샵
        let lastSearchQuery = '홍대'; 

        kakao.maps.load(function() {
            const container = document.getElementById('map');
            const options = {
                center: new kakao.maps.LatLng(37.5563, 126.9231), // 홍대 중심
                level: 5
            };

            map = new kakao.maps.Map(container, options);
            ps = new kakao.maps.services.Places();
            infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

            // 1. 지도가 뜨자마자 즉시 기본 검색(홍대) 실행 (로딩 지연 방지)
            executeSearch(lastSearchQuery);

            // 2. 현재 위치는 백그라운드에서 비동기로 가져오기 (로딩 멈춤 현상 원천 차단)
            initCurrentLocation();

            // 검색폼 이벤트
            document.getElementById('form').addEventListener('submit', function(e) {
                e.preventDefault();
                const query = document.getElementById('keyword').value.trim();
                if(query) {
                    lastSearchQuery = query;
                    geocodeAndSearch(lastSearchQuery);
                } else {
                    alert('검색할 지역 이름을 입력해주세요!');
                }
            });
        });

        // 현재 위치 비동기 가져오기
        function initCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        currentPosition = new kakao.maps.LatLng(lat, lng);

                        new kakao.maps.Marker({
                            position: currentPosition,
                            map: map
                        });
                    },
                    function(error) {
                        console.log("위치 권한 거부됨 또는 지원 안 함");
                    },
                    { timeout: 5000 }
                );
            }
        }

        // 내 위치로 지도 중심 이동 버튼
        function moveToCurrentLocation() {
            if (currentPosition) {
                map.setCenter(currentPosition);
                map.setLevel(4);
            } else {
                alert('현재 위치를 가져오지 못했거나 위치 권한이 허용되지 않았습니다.');
            }
        }

        // 카테고리 탭 변경 함수 (피규어샵 / 굿즈샵)
        function changeCategory(category, btnElement) {
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.className = "tab-btn py-2 text-xs font-bold bg-white text-slate-700 border border-slate-200 rounded-lg transition";
            });
            btnElement.className = "tab-btn py-2 text-xs font-bold bg-indigo-600 text-white rounded-lg shadow-sm transition";

            currentCategory = category;
            executeSearch(lastSearchQuery);
        }

        // 지역 이름 좌표 변환 후 이동 및 검색
        function geocodeAndSearch(query) {
            const geocoder = new kakao.maps.services.Geocoder();
            geocoder.addressSearch(query, function(result, status) {
                if (status === kakao.maps.services.Status.OK) {
                    const coords = new kakao.maps.LatLng(result[0].y, result[0].x);
                    map.setCenter(coords);
                    map.setLevel(5);
                }
                executeSearch(query);
            });
        }

        // 검색 실행
        function executeSearch(query) {
            let searchKeyword = query;
            if (currentCategory === 'figure') {
                searchKeyword = query + " 피규어샵";
            } else {
                searchKeyword = query + " 애니메이션 굿즈";
            }

            document.getElementById('status').textContent = `'${query}' 주변 탐색 중...`;

            const searchOptions = {
                location: map.getCenter(),
                radius: 10000
            };

            ps.keywordSearch(searchKeyword, placesCB, searchOptions);
        }

        // 검색 결과 처리 및 마커 색상 구분 적용
        function placesCB(data, status) {
            const listEl = document.getElementById('list');
            listEl.innerHTML = '';
            removeMarkers();

            if (status === kakao.maps.services.Status.OK) {
                const filtered = data.filter(place => {
                    const name = place.place_name;
                    const category = place.category_name || '';
                    
                    const excludeWords = ['소품샵', '인테리어소품', '핸드메이드', '악세사리', '의류', '패션', '꽃집', '카페', '커머스', '물류', '음식점', '술집', '문구'];
                    const hasExcluded = excludeWords.some(word => name.includes(word) || category.includes(word));
                    
                    return !hasExcluded;
                });

                if (filtered.length === 0) {
                    listEl.innerHTML = '<div class="p-8 text-center text-slate-400 text-xs">해당 지역 근처에 조건에 맞는 매장이 없습니다.</div>';
                    document.getElementById('status').textContent = '검색 결과 없음';
                    return;
                }

                const bounds = new kakao.maps.LatLngBounds();
                
                filtered.forEach(place => {
                    const pos = new kakao.maps.LatLng(place.y, place.x);

                    let markerImageUrl = 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_blue.png'; // 피규어샵 (파랑)
                    if (currentCategory === 'goods') {
                        markerImageUrl = 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_green.png'; // 굿즈샵 (초록)
                    }

                    const markerImage = new kakao.maps.MarkerImage(markerImageUrl, new kakao.maps.Size(31, 35));
                    const marker = new kakao.maps.Marker({
                        position: pos,
                        image: markerImage,
                        map: map
                    });

                    markers.push(marker);
                    bounds.extend(pos);

                    const item = document.createElement('div');
                    item.className = 'p-3.5 hover:bg-slate-50 cursor-pointer border-b border-slate-100 group';
                    item.innerHTML = `
                        <div class="font-bold text-slate-800 text-xs group-hover:text-indigo-600 transition">${place.place_name}</div>
                        <div class="text-[11px] text-slate-500 mt-0.5">📍 ${place.road_address_name || place.address_name}</div>
                        ${place.phone ? `<div class="text-[11px] text-indigo-600 mt-1 font-medium">📞 ${place.phone}</div>` : ''}
                    `;

                    kakao.maps.event.addListener(marker, 'click', () => showInfo(marker, place));
                    item.addEventListener('click', () => {
                        map.setCenter(pos);
                        showInfo(marker, place);
                    });

                    listEl.appendChild(item);
                });

                map.setBounds(bounds);
                document.getElementById('status').textContent = `✨ 전문 매장 ${filtered.length}개 탐색 완료`;
            } else {
                listEl.innerHTML = '<div class="p-8 text-center text-slate-400 text-xs">검색 결과가 없습니다. 다른 지역명을 입력해보세요!</div>';
                document.getElementById('status').textContent = '결과 없음';
            }
        }

        function removeMarkers() {
            markers.forEach(m => m.setMap(null));
            markers = [];
        }

        function showInfo(marker, place) {
            const content = `
                <div style="padding:12px;font-size:11px;width:210px;font-family:sans-serif;">
                    <strong style="font-size:13px;color:#1e293b;display:block;margin-bottom:4px;">${place.place_name}</strong>
                    <span style="color:#64748b;display:block;line-height:1.4;margin-bottom:6px;">${place.road_address_name || place.address_name}</span>
                    ${place.phone ? `<span style="color:#4f46e5;display:block;margin-bottom:6px;font-weight:bold;">📞 ${place.phone}</span>` : ''}
                    <a href="${place.place_url}" target="_blank" style="color:#ffffff;background:#4f46e5;padding:5px 10px;border-radius:6px;display:inline-block;text-decoration:none;font-weight:bold;">카카오맵 상세 보기 ↗</a>
                </div>
            `;
            infowindow.setContent(content);
            infowindow.open(map, marker);
        }
    </script>
</body>
</html>
