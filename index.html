<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전국 애니메이션 굿즈샵 & 피규어 성지 지도</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 카카오맵 SDK -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=7dc4b6e17f706b35e52af0bb2e9c56e5&libraries=services&autoload=false"></script>
    <style>
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col overflow-hidden m-0 font-sans">

    <!-- 상단 헤더 -->
    <header class="bg-slate-900 text-white px-6 py-3.5 flex items-center justify-between shadow">
        <h1 class="text-sm font-bold flex items-center gap-2">
            <span>✨</span> 전국 애니메이션 굿즈샵 & 피규어 성지 지도
        </h1>
        <span id="status" class="text-xs text-slate-400">지역별 전문 샵 탐색 준비 완료</span>
    </header>

    <!-- 메인 레이아웃 -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- 왼쪽 사이드바 -->
        <section class="w-full md:w-96 bg-white border-r border-slate-200 flex flex-col shadow-sm">
            <!-- 지역별 빠른 탭 버튼 (지역명만 누르면 그 동네 굿즈샵을 알아서 탐색) -->
            <div class="grid grid-cols-4 gap-1 p-3 bg-slate-50 border-b border-slate-200">
                <button onclick="searchRegion('홍대', this)" class="tab-btn py-2 text-xs font-bold bg-indigo-600 text-white rounded-lg shadow-sm transition">서울(홍대)</button>
                <button onclick="searchRegion('국제전자센터', this)" class="tab-btn py-2 text-xs font-bold bg-white text-slate-700 border border-slate-200 rounded-lg transition">서울(국전)</button>
                <button onclick="searchRegion('대전', this)" class="tab-btn py-2 text-xs font-bold bg-white text-slate-700 border border-slate-200 rounded-lg transition">대전</button>
                <button onclick="searchRegion('부산', this)" class="tab-btn py-2 text-xs font-bold bg-white text-slate-700 border border-slate-200 rounded-lg transition">부산</button>
            </div>

            <!-- 직접 지역 검색창 (예: '홍대', '강남', '대구' 등 지역명만 입력) -->
            <div class="p-3 border-b border-slate-200 bg-white">
                <form id="form" class="flex gap-2">
                    <input type="text" id="keyword" placeholder="지역 이름 입력 (예: 홍대, 건대, 부산)" class="flex-1 px-3 py-2 bg-slate-100 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-xs font-bold transition">지역 검색</button>
                </form>
            </div>

            <!-- 매장 리스트 -->
            <div id="list" class="flex-1 overflow-y-auto divide-y divide-slate-100">
                <div class="p-8 text-center text-slate-400 text-xs">지역별 애니메이션 굿즈샵 정보를 불러오는 중입니다...</div>
            </div>
        </section>

        <!-- 오른쪽 지도 -->
        <section class="flex-1 relative">
            <div id="map" class="w-full h-full"></div>
        </section>
    </main>

    <!-- 스크립트 로직 -->
    <script>
        let map, ps, infowindow;
        let markers = [];

        kakao.maps.load(function() {
            const container = document.getElementById('map');
            const options = {
                center: new kakao.maps.LatLng(37.5563, 126.9231),
                level: 5
            };

            map = new kakao.maps.Map(container, options);
            ps = new kakao.maps.services.Places();
            infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

            // 검색창 이벤트 (지역 이름 입력 시 자동으로 굿즈샵 검색 조합)
            document.getElementById('form').addEventListener('submit', function(e) {
                e.preventDefault();
                const regionName = document.getElementById('keyword').value.trim();
                if(regionName) {
                    // 입력한 지역 이름에 '애니메이션 굿즈 피규어'를 자동 결합하여 검색
                    searchRegion(regionName, null);
                } else {
                    alert('지역 이름을 입력해주세요!');
                }
            });

            // 첫 실행 시 기본으로 홍대 지역 굿즈샵 검색
            searchRegion('홍대', null);
        });

        function searchRegion(regionName, btnElement) {
            if(btnElement) {
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.className = "tab-btn py-2 text-xs font-bold bg-white text-slate-700 border border-slate-200 rounded-lg transition";
                });
                btnElement.className = "tab-btn py-2 text-xs font-bold bg-indigo-600 text-white rounded-lg shadow-sm transition";
            }

            document.getElementById('status').textContent = `'${regionName}' 주변 굿즈/피규어샵 탐색 중...`;
            
            // 핵심: 사용자가 입력한 지역명 뒤에 '애니메이션 굿즈 피규어'를 붙여서 전문 매장만 타겟팅
            const fullQuery = regionName + " 애니메이션 굿즈 피규어";
            ps.keywordSearch(fullQuery, placesCB);
        }

        function placesCB(data, status) {
            const listEl = document.getElementById('list');
            listEl.innerHTML = '';
            removeMarkers();

            if (status === kakao.maps.services.Status.OK) {
                // [철저한 필터링] 일반 소품샵, 의류, 악세사리, 인테리어 등 엉뚱한 매장 완벽 제외
                const filtered = data.filter(place => {
                    const name = place.place_name;
                    const category = place.category_name || '';
                    
                    const excludeWords = ['소품샵', '인테리어소품', '핸드메이드', '악세사리', '의류', '패션', '꽃집', '카페', '커머스', '물류'];
                    const hasExcluded = excludeWords.some(word => name.includes(word) || category.includes(word));
                    
                    return !hasExcluded;
                });

                if (filtered.length === 0) {
                    listEl.innerHTML = '<div class="p-8 text-center text-slate-400 text-xs">해당 지역 근처에 조건에 맞는 굿즈/피규어샵이 없습니다.</div>';
                    document.getElementById('status').textContent = '검색 결과 없음';
                    return;
                }

                const bounds = new kakao.maps.LatLngBounds();
                
                filtered.forEach(place => {
                    const pos = new kakao.maps.LatLng(place.y, place.x);
                    const marker = new kakao.maps.Marker({ position: pos, map: map });
                    markers.push(marker);
                    bounds.extend(pos);

                    const item = document.createElement('div');
                    item.className = 'p-3.5 hover:bg-slate-50 cursor-pointer border-b border-slate-100 group';
                    item.innerHTML = `
                        <div class="font-bold text-slate-800 text-xs group-hover:text-indigo-600 transition">${place.place_name}</div>
                        <div class="text-[11px] text-slate-500 mt-0.5">📍 ${place.road_address_name || place.address_name}</div>
                        ${place.phone ? `<div class="text-[11px] text-indigo-600 mt-1 font-medium">📞 ${place.phone}</div>` : ''}
                    `;

                    kakao.maps.event.addListener(marker, 'click', () => showInfo(marker, place));
                    item.addEventListener('click', () => {
                        map.setCenter(pos);
                        showInfo(marker, place);
                    });

                    listEl.appendChild(item);
                });

                map.setBounds(bounds);
                document.getElementById('status').textContent = `✨ 전문 굿즈/피규어샵 ${filtered.length}개 탐색 완료`;
            } else {
                listEl.innerHTML = '<div class="p-8 text-center text-slate-400 text-xs">검색 결과가 없습니다. 다른 지역명을 입력해보세요!</div>';
                document.getElementById('status').textContent = '결과 없음';
            }
        }

        function removeMarkers() {
            markers.forEach(m => m.setMap(null));
            markers = [];
        }

        function showInfo(marker, place) {
            const content = `
                <div style="padding:12px;font-size:11px;width:210px;font-family:sans-serif;">
                    <strong style="font-size:13px;color:#1e293b;display:block;margin-bottom:4px;">${place.place_name}</strong>
                    <span style="color:#64748b;display:block;line-height:1.4;margin-bottom:6px;">${place.road_address_name || place.address_name}</span>
                    ${place.phone ? `<span style="color:#4f46e5;display:block;margin-bottom:6px;font-weight:bold;">📞 ${place.phone}</span>` : ''}
                    <a href="${place.place_url}" target="_blank" style="color:#ffffff;background:#4f46e5;padding:5px 10px;border-radius:6px;display:inline-block;text-decoration:none;font-weight:bold;">카카오맵 상세 보기 ↗</a>
                </div>
            `;
            infowindow.setContent(content);
            infowindow.open(map, marker);
        }
    </script>
</body>
</html>
