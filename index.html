<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">

    <!-- 상단 헤더 -->

        <h1 class="text-xl font-bold text-gray-800">✨ 전국 애니메이션 굿즈샵 성지 지도</h1>
        <span id="status-message" class="text-sm text-gray-500">실제 오프라인 굿즈샵 좌표 연동 중...</span>
    </header>

    <!-- 메인 컨테이너 (2분할 레이아웃) -->

        <!-- 왼쪽: 지역별 리스트 영역 -->
        <section class="w-full md:w-96 bg-white border-r border-gray-200 flex flex-col z-10">
            <div class="p-4 border-b border-gray-200 bg-gray-50 font-bold text-sm text-gray-700">
                📌 지역별 굿즈샵 성지 리스트 (검색 필요 없음)
            </div>
            <!-- 검색 결과 리스트 -->
            <div id="place-list" class="flex-1 overflow-y-auto divide-y divide-gray-100">
                <div class="p-6 text-center text-gray-400 text-sm">
                    전국 굿즈샵 정보를 불러오는 중입니다...
                </div>
            </div>
        </section>

        <!-- 오른쪽: 지도 영역 -->
        <section class="flex-1 relative">
            <div id="map" class="w-full h-full"></div>

            <!-- 로드뷰 보기 버튼 -->
            <button 
                onclick="openRoadview()" 
                class="absolute top-4 right-4 bg-white hover:bg-gray-100 text-gray-800 font-semibold px-4 py-2 rounded-lg shadow-md border border-gray-300 text-sm z-10 transition"
            >
                👀 지도 중심 로드뷰 보기
            </button>
        </section>
    </main>

    <!-- JavaScript 로직 -->

            { region: "📍 대전 지역", name: "애니플러스샵 대전 중앙로점" },
            { region: "📍 대전 지역", name: "건담베이스 대전점" },
            { region: "📍 대전 지역", name: "토이앤하비 대전" },
            { region: "📍 대전 지역", name: "대전 펀샵" },
            { region: "📍 대전 지역", name: "대전 피규어박스" },
            { region: "📍 대전 지역", name: "은행동 가챠샵" },

            { region: "📍 대전 지역", name: "대전 애니포스" },
            { region: "📍 대전 지역", name: "대전 덕후존" },
            { region: "📍 대전 지역", name: "대전 굿즈랜드" },
            { region: "📍 대전 지역", name: "대전 키덜트샵" },
            { region: "📍 대전 지역", name: "대전 복합터미널 토이저러스" },
            { region: "📍 대전 지역", name: "대전 갤러리아 타임월드 피규어" },

            { region: "📍 대전 지역", name: "대전 성심당 문화원 인근 굿즈" },

            // --- [부산 지역 20개] ---
            { region: "📍 부산 지역", name: "애니메이트 부산점" },
            { region: "📍 부산 지역", name: "애니플러스샵 부산서면점" },
            { region: "📍 부산 지역", name: "제이굿즈 부산점" },
            { region: "📍 부산 지역", name: "건담베이스 부산점" },
            { region: "📍 부산 지역", name: "서면 애니메클럽" },
            { region: "📍 부산 지역", name: "부산 애니창고" },
            { region: "📍 부산 지역", name: "남포동 피규어샵" },
            { region: "📍 부산 지역", name: "서면 삼정타워 팝업" },
            { region: "📍 부산 지역", name: "부산 으뜸플러스" },
            { region: "📍 부산 지역", name: "부산 캡슐토이샵" },
            { region: "📍 부산 지역", name: "부산 서면 지하상가 굿즈" },
            { region: "📍 부산 지역", name: "부산 센텀시티 신세계 팝업" },
            { region: "📍 부산 지역", name: "부산 롯데백화점 부산본점" },
            { region: "📍 부산 지역", name: "부산 경성대 피규어" },
            { region: "📍 부산 지역", name: "부산대 토이프렌드" },
            { region: "📍 부산 지역", name: "부산 가챠샵 서면" },
            { region: "📍 부산 지역", name: "부산 하비샵" },
            { region: "📍 부산 지역", name: "부산 캐릭터샵" },
            { region: "📍 부산 지역", name: "부산 덕질 공간" },
            { region: "📍 부산 지역", name: "부산 서면 굿즈 전문점" }
        ];

        let map = null;
        let ps = null;
        let infowindow = null;
        let markers = [];

        kakao.maps.load(function() {
            initMap();
        });

        function initMap() {
            const container = document.getElementById('map');
            const options = {
                center: new kakao.maps.LatLng(37.5563, 126.9231), // 홍대 중심
                level: 5
            };

            map = new kakao.maps.Map(container, options);
            ps = new kakao.maps.services.Places();
            infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

            loadAllPlaces();
        }

        // 카카오 DB에서 상호명별 실제 좌표를 실시간 조회하여 정확하게 매핑
        function loadAllPlaces() {
            const bounds = new kakao.maps.LatLngBounds();
            const loadedPlaces = [];
            let count = 0;

            shopList.forEach((item) => {
                ps.keywordSearch(item.name, function(data, status) {
                    count++;
                    if (status === kakao.maps.services.Status.OK && data.length > 0) {
                        const realPlace = data[0]; // 카카오 검색 결과 첫 번째 (가장 정확)
                        realPlace.region = item.region;
                        loadedPlaces.push(realPlace);
                    }

                    if (count === shopList.length) {
                        renderPlaces(loadedPlaces);
                    }
                });
            });
        }

        function renderPlaces(places) {
            const listEl = document.getElementById('place-list');
            listEl.innerHTML = '';
            removeMarkers();

            if (places.length === 0) {
                listEl.innerHTML = '<div class="p-6 text-center text-gray-400 text-sm">장소 정보를 불러오지 못했습니다.</div>';
                return;
            }

            const bounds = new kakao.maps.LatLngBounds();

            // 지역별 그룹화
            const grouped = {};
            places.forEach(p => {
                if (!grouped[p.region]) grouped[p.region] = [];
                grouped[p.region].push(p);
            });

            for (let regionName in grouped) {
                // 지역 배너 헤더
                const regionHeader = document.createElement('div');
                regionHeader.className = 'bg-gray-100 px-4 py-2 text-xs font-bold text-gray-600 border-b border-gray-200';
                regionHeader.textContent = regionName;
                listEl.appendChild(regionHeader);

                grouped[regionName].forEach(place => {
                    const position = new kakao.maps.LatLng(place.y, place.x);

                    // [숫자 마커 제거] 기본 일반 마커 생성
                    const marker = new kakao.maps.Marker({
                        position: position,
                        map: map
                    });
                    markers.push(marker);
                    bounds.extend(position);

                    // 리스트 아이템 생성
                    const itemEl = document.createElement('div');
                    itemEl.className = 'p-4 hover:bg-gray-50 cursor-pointer transition border-b border-gray-100';
                    itemEl.innerHTML = `
                        <h5 class="font-bold text-gray-800 text-sm">${place.place_name}</h5>
                        <p class="text-xs text-gray-600 mt-1">도로명: ${place.road_address_name || place.address_name}</p>
                        ${place.phone ? `<p class="text-xs text-blue-600 mt-1">📞 ${place.phone}</p>` : ''}
                    `;

                    // 클릭 이벤트
                    kakao.maps.event.addListener(marker, 'click', function() {
                        displayInfowindow(marker, place);
                    });

                    itemEl.addEventListener('click', function() {
                        map.setCenter(marker.getPosition());
                        displayInfowindow(marker, place);
                    });

                    listEl.appendChild(itemEl);
                });
            }

            map.setBounds(bounds);
            document.getElementById('status-message').textContent = "실존 상호명 & 정확한 좌표 연동 완료";
        }

        function removeMarkers() {
            for (let i = 0; i < markers.length; i++) {
                markers[i].setMap(null);
            }
            markers = [];
        }

        function displayInfowindow(marker, place) {
            const content = `
                <div style="padding:10px;font-size:12px;width:200px;z-index:1;">
                    <strong style="font-size:14px;color:#1d4ed8;">${place.place_name}</strong><br>
                    <span style="color:#4b5563;display:block;margin-top:4px;">${place.road_address_name || place.address_name}</span>
                    ${place.phone ? `<span style="color:#2563eb;display:block;margin-top:2px;">📞 ${place.phone}</span>` : ''}
                    <a href="${place.place_url}" target="_blank" style="color:#059669;display:block;margin-top:4px;text-decoration:underline;">카카오맵 상세보기</a>
                </div>
            `;
            infowindow.setContent(content);
            infowindow.open(map, marker);
        }

        function openRoadview() {
            const center = map.getCenter();
            const rvUrl = `https://map.kakao.com/?roadview=true&y=${center.getLat()}&x=${center.getLng()}`;
            window.open(rvUrl, '_blank');
        }
    </script>
</body>
