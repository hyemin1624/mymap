<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전국 애니메이션 굿즈샵 성지 지도</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 카카오맵 JavaScript SDK 로드 -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=7dc4b6e17f706b35e52af0bb2e9c56e5&libraries=services&autoload=false"></script>
    <style>
        /* 스크롤바 커스텀으로 세련미 추가 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col overflow-hidden font-sans">

    <!-- 상단 세련된 헤더 -->
    <header class="bg-slate-900 text-white shadow-md px-6 py-3.5 flex items-center justify-between z-10">
        <div class="flex items-center gap-2">
            <span class="text-2xl">✨</span>
            <h1 class="text-lg font-extrabold tracking-tight">전국 애니메이션 굿즈샵 성지 지도</h1>
        </div>
        <span id="status-message" class="text-xs text-slate-400 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">시스템 초기화 중...</span>
    </header>

    <!-- 메인 컨테이너 (2분할 레이아웃) -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- 왼쪽: 사이드바 (리스트 & 탭) -->
        <section class="w-full md:w-96 bg-white border-r border-slate-200 flex flex-col z-10 shadow-sm">
            
            <!-- 세련된 탭 버튼 영역 -->
            <div class="grid grid-cols-4 gap-1.5 p-3 border-b border-slate-100 bg-slate-50">
                <button 
                    id="tab-all" 
                    onclick="switchRegion('all')"
                    class="py-2 px-1 rounded-xl text-xs font-bold bg-indigo-600 text-white shadow-sm transition transform active:scale-95"
                >
                    🌐 전체
                </button>
                <button 
                    id="tab-seoul" 
                    onclick="switchRegion('seoul')"
                    class="py-2 px-1 rounded-xl text-xs font-bold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition transform active:scale-95"
                >
                    🗼 서울
                </button>
                <button 
                    id="tab-daejeon" 
                    onclick="switchRegion('daejeon')"
                    class="py-2 px-1 rounded-xl text-xs font-bold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition transform active:scale-95"
                >
                    🏛️ 대전
                </button>
                <button 
                    id="tab-busan" 
                    onclick="switchRegion('busan')"
                    class="py-2 px-1 rounded-xl text-xs font-bold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition transform active:scale-95"
                >
                    🌊 부산
                </button>
            </div>

            <!-- 매장 리스트 영역 -->
            <div id="place-list" class="flex-1 overflow-y-auto divide-y divide-slate-100">
                <div class="p-8 text-center text-slate-400 text-sm">
                    매장 정보를 불러오는 중입니다...
                </div>
            </div>
        </section>

        <!-- 오른쪽: 지도 영역 -->
        <section class="flex-1 relative">
            <div id="map" class="w-full h-full"></div>

            <!-- 모던한 로드뷰 보기 버튼 -->
            <button 
                onclick="openRoadview()" 
                class="absolute top-4 right-4 bg-white/90 backdrop-blur hover:bg-white text-slate-700 font-bold px-4 py-2.5 rounded-xl shadow-lg border border-slate-200 text-xs transition flex items-center gap-1.5 z-10"
            >
                <span>👀</span> 현재 중심 로드뷰 보기
            </button>
        </section>
    </main>

    <!-- JavaScript 로직 -->
    <script>
        const seoulShops = [
            "애니메이트 홍대점", "라신반 서울본점", "피규어프레소 홍대점", "안서당", 
            "제이에스스토어", "CIH+SHOP", "오모차랜드 홍대점", "최애굿즈 홍대점", 
            "모와즐", "브라더굿즈", "아이노모노", "팝몬 홍대점", "케이북스 홍대",
            "국제전자센터 하비파크", "국제전자센터 논노21", "국제전자센터 덴덴샵", 
            "국제전자센터 쿄우마샵", "건담베이스 용산아이파크몰점", "코믹존", 
            "애니플러스샵 홍대점", "토이저러스 홍대점", "피규어프레소 신도림점"
        ];

        const daejeonShops = [
            "제이굿즈 대전점", "애니세카이", "애니플러스샵 대전 중앙로점", 
            "건담베이스 대전점", "토이앤하비 대전", "대전 피규어박스", 
            "은행동 가챠샵", "대전 토이프렌드", "대전 굿즈랜드"
        ];

        const busanShops = [
            "애니메이트 부산점", "애니플러스샵 부산서면점", "제이굿즈 부산점", 
            "건담베이스 부산점", "서면 애니메클럽", "부산 애니창고", 
            "남포동 피규어샵", "서면 삼정타워", "부산대 토이프렌드"
        ];

        let map = null;
        let ps = null;
        let infowindow = null;
        let markers = [];
        let currentPosMarker = null;

        kakao.maps.load(function() {
            initMap();
        });

        function initMap() {
            const container = document.getElementById('map');
            const options = {
                center: new kakao.maps.LatLng(37.5563, 126.9231),
                level: 5
            };

            map = new kakao.maps.Map(container, options);
            ps = new kakao.maps.services.Places();
            infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

            initCurrentLocation();
            switchRegion('all');
        }

        function initCurrentLocation() {
            const statusMessage = document.getElementById('status-message');
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const locPosition = new kakao.maps.LatLng(lat, lng);

                        // 현재 위치는 눈에 띄는 특별한 마커로 표시
                        currentPosMarker = new kakao.maps.Marker({
                            position: locPosition,
                            map: map
                        });

                        statusMessage.textContent = "📍 현재 위치 연동 완료";
                    },
                    function(error) {
                        statusMessage.textContent = "📍 위치 권한 거부됨 (기본 홍대 중심)";
                    }
                );
            } else {
                statusMessage.textContent = "📍 위치 미지원 브라우저";
            }
        }

        function switchRegion(regionKey) {
            // 버튼 디자인 초기화
            ['all', 'seoul', 'daejeon', 'busan'].forEach(key => {
                const btn = document.getElementById(`tab-${key}`);
                btn.className = "py-2 px-1 rounded-xl text-xs font-bold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition transform active:scale-95";
            });

            let targetLists = [];
            let activeBtnId = `tab-${regionKey}`;

            if (regionKey === 'all') {
                targetLists = [
                    { regionName: "🗼 서울 지역 성지", names: seoulShops, color: "#4f46e5" }, // 인디고 블루
                    { regionName: "🏛️ 대전 지역 성지", names: daejeonShops, color: "#10b981" }, // 에메랄드 그린
                    { regionName: "🌊 부산 지역 성지", names: busanShops, color: "#8b5cf6" }  // 퍼플
                ];
            } else if (regionKey === 'seoul') {
                targetLists = [{ regionName: "🗼 서울 지역 성지", names: seoulShops, color: "#4f46e5" }];
            } else if (regionKey === 'daejeon') {
                targetLists = [{ regionName: "🏛️ 대전 지역 성지", names: daejeonShops, color: "#10b981" }];
            } else if (regionKey === 'busan') {
                targetLists = [{ regionName: "🌊 부산 지역 성지", names: busanShops, color: "#8b5cf6" }];
            }

            document.getElementById(activeBtnId).className = "py-2 px-1 rounded-xl text-xs font-bold bg-indigo-600 text-white shadow-sm transition transform active:scale-95";

            loadGroupedPlaces(targetLists);
        }

        function loadGroupedPlaces(groupList) {
            const listEl = document.getElementById('place-list');
            listEl.innerHTML = '<div class="p-8 text-center text-slate-400 text-sm animate-pulse">매장 위치 불러오는 중...</div>';
            removeMarkers();

            let totalGroups = groupList.length;
            let completedGroups = 0;
            const allRenderData = [];

            groupList.forEach(group => {
                let groupCount = 0;
                let groupPlaces = [];

                group.names.forEach(name => {
                    ps.keywordSearch(name, function(data, status) {
                        groupCount++;
                        if (status === kakao.maps.services.Status.OK && data.length > 0) {
                            const placeObj = data[0];
                            placeObj.customRegion = group.regionName;
                            placeObj.markerColor = group.color;
                            groupPlaces.push(placeObj);
                        }

                        if (groupCount === group.names.length) {
                            allRenderData.push({
                                regionName: group.regionName,
                                places: groupPlaces
                            });
                            completedGroups++;

                            if (completedGroups === totalGroups) {
                                renderGroupedPlaces(allRenderData);
                            }
                        }
                    });
                });
            });
        }

        // [물음표 방지] 브라우저가 완벽하게 그려내는 SVG 커스텀 원형 마커 생성 함수
        function createSvgMarker(position, color) {
            const svgContent = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="${color}" stroke="#ffffff" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>`;
            const encodedSvg = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgContent);

            const markerImage = new kakao.maps.MarkerImage(
                encodedSvg,
                new kakao.maps.Size(26, 26),
                { offset: new kakao.maps.Point(13, 13) }
            );

            return new kakao.maps.Marker({
                position: position,
                image: markerImage,
                map: map
            });
        }

        function renderGroupedPlaces(groupedData) {
            const listEl = document.getElementById('place-list');
            listEl.innerHTML = '';
            removeMarkers();

            const bounds = new kakao.maps.LatLngBounds();
            let hasData = false;

            groupedData.forEach(group => {
                if (group.places.length === 0) return;
                hasData = true;

                // 세련된 지역별 헤더 배너
                const headerEl = document.createElement('div');
                headerEl.className = 'bg-slate-100 px-4 py-2.5 text-xs font-bold text-slate-600 border-b border-slate-200 tracking-wider flex items-center justify-between';
                headerEl.innerHTML = `<span>${group.regionName}</span> <span class="bg-white px-2 py-0.5 rounded-full text-[10px] text-slate-500 shadow-sm">${group.places.length}곳</span>`;
                listEl.appendChild(headerEl);

                group.places.forEach(place => {
                    const position = new kakao.maps.LatLng(place.y, place.x);

                    const marker = createSvgMarker(position, place.markerColor);
                    markers.push(marker);
                    bounds.extend(position);

                    // 모던한 카드형 리스트 아이템
                    const itemEl = document.createElement('div');
                    itemEl.className = 'p-4 hover:bg-slate-50 cursor-pointer transition border-b border-slate-100 group';
                    itemEl.innerHTML = `
                        <h5 class="font-bold text-slate-800 text-sm group-hover:text-indigo-600 transition">${place.place_name}</h5>
                        <p class="text-xs text-slate-500 mt-1">📍 ${place.road_address_name || place.address_name}</p>
                        ${place.phone ? `<p class="text-xs text-indigo-500 mt-1 font-medium">📞 ${place.phone}</p>` : ''}
                    `;

                    kakao.maps.event.addListener(marker, 'click', function() {
                        displayInfowindow(marker, place);
                    });

                    itemEl.addEventListener('click', function() {
                        map.setCenter(marker.getPosition());
                        displayInfowindow(marker, place);
                    });

                    listEl.appendChild(itemEl);
                });
            });

            if (!hasData) {
                listEl.innerHTML = '<div class="p-8 text-center text-slate-400 text-sm">표시할 매장 정보가 없습니다.</div>';
                return;
            }

            map.setBounds(bounds);
            document.getElementById('status-message').textContent = "✨ 지도 로드 완료";
        }

        function removeMarkers() {
            for (let i = 0; i < markers.length; i++) {
                markers[i].setMap(null);
            }
            markers = [];
        }

        function displayInfowindow(marker, place) {
            const content = `
                <div style="padding:12px;font-size:12px;width:210px;z-index:1;font-family:sans-serif;">
                    <strong style="font-size:14px;color:#1e293b;display:block;margin-bottom:4px;">${place.place_name}</strong>
                    <span style="color:#64748b;display:block;line-height:1.4;margin-bottom:6px;">${place.road_address_name || place.address_name}</span>
                    ${place.phone ? `<span style="color:#4f46e5;display:block;margin-bottom:6px;font-weight:600;">📞 ${place.phone}</span>` : ''}
                    <a href="${place.place_url}" target="_blank" style="color:#ffffff;background:#4f46e5;padding:5px 10px;border-radius:6px;display:inline-block;text-decoration:none;font-weight:bold;font-size:11px;">카카오맵 상세 보기 ↗</a>
                </div>
            `;
            infowindow.setContent(content);
            infowindow.open(map, marker);
        }

        function openRoadview() {
            const center = map.getCenter();
            const rvUrl = `https://map.kakao.com/?roadview=true&y=${center.getLat()}&x=${center.getLng()}`;
            window.open(rvUrl, '_blank');
        }
    </script>
</body>
</html>
