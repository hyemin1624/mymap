        // 지도 초기화 함수
        function initMap() {
            const container = document.getElementById('map');
            const options = {
                center: new kakao.maps.LatLng(37.5563, 126.9231), // 홍대입구역 중심
                level: 5
            };

            map = new kakao.maps.Map(container, options);
            infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

            // 시작할 때 탭1(굿즈샵 성지) 리스트 출력
            displayPlaces(goodsShops);
        }

        // 탭 전환 함수
        function switchTab(type) {
            if (type === 'goods') {
                document.getElementById('tab-1').className = "py-2 px-3 rounded-lg text-sm font-semibold bg-blue-600 text-white transition shadow-sm";
                document.getElementById('tab-2').className = "py-2 px-3 rounded-lg text-sm font-semibold bg-gray-200 text-gray-700 hover:bg-gray-300 transition";
                displayPlaces(goodsShops);
            } else {
                document.getElementById('tab-1').className = "py-2 px-3 rounded-lg text-sm font-semibold bg-gray-200 text-gray-700 hover:bg-gray-300 transition";
                document.getElementById('tab-2').className = "py-2 px-3 rounded-lg text-sm font-semibold bg-blue-600 text-white transition shadow-sm";
                displayPlaces(popupShops);
            }
        }

        // 리스트와 마커를 지역별 섹션으로 나누어 뿌려주는 함수
        function displayPlaces(places) {
            const listEl = document.getElementById('place-list');
            listEl.innerHTML = '';
            removeMarkers(); // 기존 마커 지우기

            const bounds = new kakao.maps.LatLngBounds();

            // 지역별로 데이터 그룹화
            const grouped = {};
            for (let i = 0; i < places.length; i++) {
                const p = places[i];
                if (!grouped[p.region]) {
                    grouped[p.region] = [];
                }
                grouped[p.region].push(p);
            }

            // 지역 섹션별로 HTML 생성
            for (let regionName in grouped) {
                // 지역 헤더 배너 생성
                const regionHeader = document.createElement('div');
                regionHeader.className = 'bg-gray-100 px-4 py-2 text-xs font-bold text-gray-600 border-b border-gray-200';
                regionHeader.textContent = regionName;
                listEl.appendChild(regionHeader);

                // 해당 지역의 장소들 추가
                const regionPlaces = grouped[regionName];
                for (let j = 0; j < regionPlaces.length; j++) {
                    const place = regionPlaces[j];
                    const position = new kakao.maps.LatLng(place.y, place.x);
                    
                    // [숫자 마커 제거] 기본 일반 마커 생성
                    const marker = new kakao.maps.Marker({
                        position: position,
                        map: map
                    });
                    markers.push(marker);

                    // 리스트 아이템 HTML 생성
                    const itemEl = document.createElement('div');
                    itemEl.className = 'p-4 hover:bg-gray-50 cursor-pointer transition border-b border-gray-100';
                    itemEl.innerHTML = `
                        <h5 class="font-bold text-gray-800 text-sm">${place.place_name}</h5>
                        <p class="text-xs text-gray-600 mt-1">도로명: ${place.road_address_name}</p>
                        <p class="text-xs text-gray-400 mt-0.5">지번: ${place.address_name}</p>
                        ${place.phone ? `<p class="text-xs text-blue-600 mt-1">📞 ${place.phone}</p>` : ''}
                    `;

                    bounds.extend(position);

                    // 마커 및 리스트 클릭 이벤트 (상세 팝업 연결)
                    (function(marker, placeData) {
                        kakao.maps.event.addListener(marker, 'click', function() {
                            displayInfowindow(marker, placeData);
                        });

                        itemEl.addEventListener('click', function() {
                            map.setCenter(marker.getPosition());
                            displayInfowindow(marker, placeData);
                        });
                    })(marker, place);

                    listEl.appendChild(itemEl);
                }
            }

            // 지도 범위 맞추기
            map.setBounds(bounds);
        }

        // 지도 위 마커 모두 제거
        function removeMarkers() {
            for (let i = 0; i < markers.length; i++) {
                markers[i].setMap(null);
            }
            markers = [];
        }

        // 마커 클릭 시 인포윈도우 팝업 표시
        function displayInfowindow(marker, place) {
            const content = `
                <div style="padding:10px;font-size:12px;width:200px;z-index:1;">
                    <strong style="font-size:14px;color:#1d4ed8;">${place.place_name}</strong><br>
                    <span style="color:#4b5563;display:block;margin-top:4px;">${place.road_address_name}</span>
                    ${place.phone ? `<span style="color:#2563eb;display:block;margin-top:2px;">📞 ${place.phone}</span>` : ''}
                    <a href="${place.place_url}" target="_blank" style="color:#059669;display:block;margin-top:4px;text-decoration:underline;">카카오맵 상세보기</a>
                </div>
            `;
            infowindow.setContent(content);
            infowindow.open(map, marker);
        }

        // 로드뷰 연동 함수
        function openRoadview() {
            const center = map.getCenter();
            const rvUrl = `https://map.kakao.com/?roadview=true&y=${center.getLat()}&x=${center.getLng()}`;
            window.open(rvUrl, '_blank');
        }
